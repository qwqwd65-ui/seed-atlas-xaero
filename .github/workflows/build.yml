name: build
on: [pull_request, push, workflow_dispatch]

permissions:
  contents: read

jobs:
  # 1.21.11 reuses the native engine shipped on the upstream 26.1.2 branch: the
  # bundled C library already accepts "1.21.11" (verified through sax_mc_version_supported),
  # and 1.21.11 shares the 26.1.2 world generation. No per-platform rebuild is needed.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '23'
          distribution: 'temurin'
      - name: Build and test
        shell: bash
        run: bash ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: seedatlas-xaero-1.21.11-fabric
          path: build/libs/
